<!-- Lägg till detta i index.html vid din terminal för åskådare -->
<div style="margin-top: 15px; text-align: center; font-family: sans-serif;">
    <h3>🏆 Turneringsläge: Heja på din favorit!</h3>
    <button onclick="sendCheer('comp1')" style="padding: 10px; background: #28a745; color: white; border: none; margin-right: 10px; cursor: pointer;">Heja på Competitor 1! 🔥</button>
    <button onclick="sendCheer('comp2')" style="padding: 10px; background: #007bff; color: white; border: none; cursor: pointer;">Heja på Competitor 2! 🔥</button>
</div>

<script>
    // Din befintliga WebSocket-variabel i index.html brukar heta "socket" eller "ws"
    // Använd den för att skicka cheer-signaler:
    function sendCheer(competitorRole) {
        // Hämta turneringstillståndet från API:et för att veta rätt ID
        fetch('/api/sessions')
            .then(res => res.json())
            .then(data => {
                let targetId = competitorRole === 'comp1' ? data.tournament.competitor_1 : data.tournament.competitor_2;
                if(targetId) {
                    ws.send("__CHEER__:" + targetId);
                } else {
                    alert("Ingen aktiv competitor på den här platsen just nu!");
                }
            });
    }
</script>
