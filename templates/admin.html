<!DOCTYPE html>
<html>
<head>
    <title>Emil Boss Fight - Admin Panel</title>
    <style>
        body { font-family: sans-serif; max-width: 900px; margin: 30px auto; padding: 20px; background: #f4f6f9; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #333; color: white; }
        .btn { padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-danger { background: #ff4d4d; color: white; }
        .btn-primary { background: #007bff; color: white; padding: 10px 20px; width: 100%; }
        input[type="text"], input[type="password"], textarea { width: 100%; padding: 8px; margin: 5px 0 15px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    </style>
</head>
<body>

    <h2>Emil Boss Fight Simulator – Admin Dashboard</h2>
    <div>{{ status_msg | safe }}</div>

    <!-- GLOBAL BROADCAST -->
    <div class="card">
        <h3>Skicka meddelande till ALLA terminaler</h3>
        <form method="post">
            <input type="hidden" name="action" value="broadcast">
            <label>Admin-lösenord:</label>
            <input type="password" id="admin_pwd" name="password" value="{{ password }}" required>
            <label>Meddelande:</label>
            <textarea name="message" rows="2" placeholder="Skriv live-notis här..."></textarea>
            <button type="submit" class="btn btn-primary">Skicka globalt meddelande</button>
        </form>
    </div>

    <!-- AKTIVA SESSIONER LIVE -->
    <div class="card">
        <h3>Aktiva spelare just nu Live (Uppdateras varje sekund ⏱️)</h3>
        <table>
            <thead>
                <tr>
                    <th>Session ID</th>
                    <th>Spelarnamn</th>
                    <th>Valt Språk</th>
                    <th>Vart i spelet?</th>
                    <th>Åtgärd</th>
                </tr>
            </thead>
            <tbody id="sessions_table_body">
                <tr>
                    <td colspan="5" style="text-align: center; color: #777;">Laddar live-data...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- AUTO REFRESH SCRIPT -->
    <script>
        function updateSessions() {
            // Hämta aktuellt skrivet lösenord så att det matchar i kick-knapparna
            const currentPassword = document.getElementById('admin_pwd').value;

            fetch('/api/sessions')
                .then(response => response.json())
                .then(data => {
                    const tbody = document.getElementById('sessions_table_body');
                    let html = '';

                    const keys = Object.keys(data);
                    if (keys.length === 0) {
                        html = '<tr><td colspan="5" style="text-align: center; color: #777;">Inga aktiva spelare just nu.</td></tr>';
                    } else {
                        keys.forEach(sid => {
                            const session = data[sid];
                            html += `
                            <tr>
                                <td><code>${session.id.substring(0, 8)}...</code></td>
                                <td><strong>${session.name}</strong></td>
                                <td><span style="background: #e1ecf4; padding: 3px 8px; border-radius: 4px;">${session.lang.toUpperCase()}</span></td>
                                <td><span style="color: #2b579a; font-weight: 500;">${session.stage}</span></td>
                                <td>
                                    <form method="post" style="display:inline;">
                                        <input type="hidden" name="action" value="kick_session">
                                        <input type="hidden" name="session_id" value="${session.id}">
                                        <input type="hidden" name="password" value="${currentPassword}">
                                        <button type="submit" class="btn btn-danger">Stoppa för Update</button>
                                    </form>
                                </td>
                            </tr>`;
                        });
                    }
                    tbody.innerHTML = html;
                })
                .catch(err => console.error("Kunde inte hämta live-sessioner:", err));
        }

        // Kör direkt och sedan en gång varje sekund
        updateSessions();
        setInterval(updateSessions, 1000);
    </script>

</body>
</html>
